version: 2

sources:
  - name: employee_source
    database: |
      {% if target.name == 'dev' %}
        dev_raw_edw
      {% elif target.name == 'qa' %}
        qa_raw_edw
      {% elif target.name == 'prod' %}
        prod_raw_edw
      {% else %}
        Invalid database
      {% endif %}
    schema: EMPLOYEE
    tables:
      - name: emp
        description: "Employee source data"
        columns:
          - name: emp_id
            description: "Primary identifier for each employee."
            tests:
              - unique
              - not_null

          - name: ename
            description: "Full name of the employee."
            tests:
              - not_null

          - name: address
            description: "Street address."

          - name: state
            description: "State or region code/name."

          - name: country
            description: "Country name or code."

          - name: zip
            description: "Postal/ZIP code."
  - name: customer_source
    database: |
      {% if target.name == 'dev' %}
        dev_raw_edw
      {% elif target.name == 'qa' %}
        qa_raw_edw
      {% elif target.name == 'prod' %}
        prod_raw_edw
      {% else %}
        Invalid database
      {% endif %}
    schema: customer
    tables:
      - name: customer
        description: "customer source data"